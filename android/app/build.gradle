plugins {
    id 'com.android.application'
}

// Номер збірки з GitHub Actions — щоб кожен новий APK ставився поверх старого.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.pavlozibro.sufler'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pavlozibro.sufler'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Постійний ключ підпису: оновлення встановлюються без видалення застосунку.
    signingConfigs {
        release {
            storeFile file('sufler.keystore')
            storePassword 'sufler-key'
            keyAlias 'sufler'
            keyPassword 'sufler-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
