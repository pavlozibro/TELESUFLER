name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Sufler.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sufler-apk
          path: Sufler.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Суфлер для Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Відкрий цю сторінку на телефоні й натисни **Sufler.apk**, щоб завантажити.
            Гілка: ${{ github.ref_name }}
          files: Sufler.apk
          make_latest: true
